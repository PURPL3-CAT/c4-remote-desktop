<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; media-src 'self' blob:; img-src 'self' data: blob:; font-src 'self'; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>c4 Remote Controller</title>
    <script src="./node_modules/peerjs/dist/peerjs.min.js" defer></script>
    <script src="./c4-peer-recovery.js" defer></script>
    <script src="./c4-auth-controller.js" defer></script>
    <script src="./c4-controller-vault.js" defer></script>
    <script src="./c4-controller-renderer.js" defer></script>
    <style>
        :root {
            --bg: #050608; --panel: #101318; --accent: #00e0ff; --danger: #ff0077;
            --text: #d8e8ff; --sub: #7a8a9a; --glow: rgba(0,224,255,0.4);
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: monospace; overflow: hidden; }
        #topbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); }
        input[type="text"], input[type="password"] {
            padding: 6px 8px; background: #050608; border: 1px solid #222;
            border-radius: 4px; color: var(--text); width: 230px; font-size: 13px;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 6px var(--glow); outline: none; }
        button { padding: 6px 10px; background: var(--accent); border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; }
        #release-btn { background: var(--danger); color: #fff; }
        #status { color: var(--sub); font-size: 12px; margin-left: 8px; }
        #canvas { width: 100vw; height: calc(100vh - 44px); display: block; background: #000; cursor: none; }
        video { position: fixed; width: 1px; height: 1px; left: -2px; top: -2px; opacity: 0; pointer-events: none; }
        audio { display: none; }
        #settings-panel { position: absolute; top: 48px; right: 8px; z-index: 1; width: 250px; padding: 12px; background: var(--panel); border: 1px solid #222; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.6); }
        #settings-panel[hidden] { display: none; }
        #settings-panel label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 12px; }
        #settings-panel input[type="range"] { width: 120px; }
        #settings-panel select { padding: 4px; color: var(--text); background: #050608; border: 1px solid #222; border-radius: 4px; }
        #credential-vault { margin-top: 16px; padding-top: 12px; border-top: 1px solid #222; }
        #credential-vault p { margin: 6px 0; color: var(--sub); font-size: 11px; line-height: 1.4; }
        #credential-vault-pin { box-sizing: border-box; width: 100%; margin-top: 6px; }
        #credential-vault-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        #credential-vault-actions button { font-size: 11px; }
        #forget-credentials-btn { background: var(--danger); color: #fff; }
        #credential-vault-status { min-height: 1em; }
    </style>
</head>
<body>
    <div id="topbar">
        <input id="device-id" type="text" placeholder="Device ID" autocomplete="off" aria-label="Device ID">
        <input id="access-code" type="password" placeholder="Reusable access code" autocomplete="off" aria-label="Reusable access code">
        <button id="connect-btn">Connect</button>
        <button id="fullscreen-btn">Fullscreen</button>
        <button id="release-btn">Release keys</button>
        <button id="settings-btn" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
        <div id="status">connecting to rendezvous service…</div>
    </div>
    <section id="settings-panel" aria-label="Controller settings" hidden>
        <label for="audio-enabled">
            <span>Receive audio</span>
            <input id="audio-enabled" type="checkbox">
        </label>
        <label for="mouse-speed">
            <span>Mouse speed</span>
            <input id="mouse-speed" type="range" min="0.25" max="3" step="0.25" value="1">
            <output id="mouse-speed-value" for="mouse-speed">1×</output>
        </label>
        <label for="scroll-speed">
            <span>Scroll multiplier</span>
            <input id="scroll-speed" type="range" min="0.25" max="3" step="0.25" value="1">
            <output id="scroll-speed-value" for="scroll-speed">1×</output>
        </label>
        <label for="stream-resolution">
            <span>Resolution</span>
            <select id="stream-resolution">
                <option value="1280x720">1280 × 720</option>
                <option value="960x540">960 × 540</option>
                <option value="640x360">640 × 360</option>
                <option value="1920x1080">1920 × 1080</option>
                <option value="2560x1440">2560 × 1440</option>
                <option value="3840x2160">3840 × 2160 (4K)</option>
            </select>
        </label>
        <section id="credential-vault" aria-label="Saved connection">
            <strong>Saved connection</strong>
            <p>Encrypted on this browser. Unlock once each time the page opens; use a long passphrase for better protection.</p>
            <input id="credential-vault-pin" type="password" placeholder="PIN/passphrase (8+ characters)"
                autocomplete="off" aria-label="Connection encryption PIN or passphrase">
            <div id="credential-vault-actions">
                <button id="save-credentials-btn" type="button">Save</button>
                <button id="unlock-credentials-btn" type="button" hidden>Unlock</button>
                <button id="forget-credentials-btn" type="button" hidden>Forget</button>
            </div>
            <p id="credential-vault-status" role="status" aria-live="polite"></p>
        </section>
    </section>
    <video id="video" autoplay playsinline></video>
    <audio id="remote-audio" autoplay></audio>
    <canvas id="canvas" width="1280" height="720"></canvas>
</body>
</html>
